<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Template App made by Team Hermes" />
  <link rel="icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="Equinor_Symbol_Favicon_RED_64x64px.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="https://cdn.eds.equinor.com/font/equinor-font.css" />
  <title>Template | FastAPI React</title>
</head>

<body>
  <div id="root"></div>
  <script>
    // Apply saved color-scheme before React mounts to prevent a flash.
    // Mirrors the logic in src/shared/platform/theme/useColorScheme.ts.
    try {
      const saved = localStorage.getItem('color-scheme')
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.style.colorScheme = saved
      }
    } catch (_) {}
  </script>
  <script type="module" src="./src/index.tsx"></script>
</body>

</html>
