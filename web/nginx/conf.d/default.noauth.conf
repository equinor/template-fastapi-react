server {
    listen                  8080;
    server_name             localhost;

    # security
    include                 /etc/nginx/config/security.conf;

    # logs
    access_log              /dev/stdout combined;
    error_log               /dev/stdout;

    # compression
    gzip                    on;
    gzip_vary               on;
    gzip_proxied            any;
    gzip_comp_level         6;
    gzip_types              text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # The OpenAPI document; kept as a separate location to mirror the
    # auth-aware config and so SPA's generated client / Swagger UI work.
    location = /api/openapi.json {
        proxy_pass          http://api:5000/openapi.json;
        include             /etc/nginx/config/general.conf;
        include             /etc/nginx/config/proxy.conf;
    }

    location /api/ {
        proxy_pass          http://api:5000/;

        include             /etc/nginx/config/general.conf;
        include             /etc/nginx/config/proxy.conf;
        include             /etc/nginx/config/websocket.conf;
        # No auth_request — direct passthrough (no-auth dev override).
    }

    location / {
        include             /etc/nginx/environments/*.conf;
        # No auth_request, no error_page redirect (no-auth dev override).
    }
}
