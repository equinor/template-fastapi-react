server {
    listen                  8080;
    server_name             localhost;
    client_max_body_size    2G;

    # security
    # NOTE: This also need to be included in the location block IF there are other headers being set at that level
    include                 /etc/nginx/config/security.conf;

    # logs
    access_log              /dev/stdout combined;
    error_log               /dev/stdout;

    # compression
    gzip                    on;
    gzip_vary               on;
    gzip_proxied            any;
    gzip_comp_level         6;
    gzip_types              text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    location /oauth2 {
        proxy_pass          http://oauth2:8081;
        include             /etc/nginx/config/oauth2.conf;
    }

    location = /oauth2/auth {
        proxy_pass          http://oauth2:8081;
        include             /etc/nginx/config/oauth2.auth.conf;
    }

    # Public assets that must be reachable before authentication. Browsers
    # fetch the PWA manifest and favicon as CORS requests; if oauth2-proxy
    # 302-redirects them to the IdP login page the browser blocks the
    # cross-origin redirect, polluting the console with CORS errors.
    location = /manifest.json {
        include             /etc/nginx/environments/*.conf;
    }

    location = /favicon.ico {
        include             /etc/nginx/environments/*.conf;
        access_log          off;
        log_not_found       off;
    }

    location /api/ {
        proxy_pass          http://api:5000/;

        include             /etc/nginx/config/general.conf;
        include             /etc/nginx/config/proxy.conf;
        include             /etc/nginx/config/websocket.conf;
        # Enforce auth, but return 401 instead of redirecting to the login page.
        include             /etc/nginx/config/oauth2.redirect.conf;
        error_page          401 = @api_unauthorized;
    }

    location @api_unauthorized {
        return 401;
    }

    location / {
        include             /etc/nginx/environments/*.conf;
        # Enforce auth, redirect to sign-in page if not authenticated.
        include             /etc/nginx/config/oauth2.redirect.conf;
        error_page 401 =    /oauth2/sign_in;
    }
}
