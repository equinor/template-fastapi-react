user                        nginx nginx;
pid                         /run/nginx/nginx.pid;
worker_processes            auto;
worker_rlimit_nofile        65535;

include                     /etc/nginx/modules-enabled/*.conf;

events {
    multi_accept            on;
    worker_connections      65535;
}

http {
    charset                 utf-8;
    sendfile                on;
    tcp_nopush              on;
    tcp_nodelay             on;
    server_tokens           off;
    log_not_found           off;
    types_hash_max_size     2048;
    types_hash_bucket_size  64;
    client_max_body_size    32M;

    # oauth2-proxy issues a fresh `_oauth2_proxy_csrf_*` cookie per
    # in-flight sign-in (see `cookie_csrf_per_request` /
    # `cookie_csrf_per_request_limit` in oauth2-proxy.toml). With up to
    # 20 concurrent CSRF cookies plus the session cookie the inbound
    # request headers can exceed the 8k default and nginx returns
    # `400 Bad Request — Request Header Or Cookie Too Large`.
    client_header_buffer_size   16k;
    large_client_header_buffers 4 32k;

    # OIDC ID tokens are large; bump proxy buffers for /oauth2/auth subrequests.
    proxy_buffer_size       128k;
    proxy_buffers           4 256k;
    proxy_busy_buffers_size 256k;

    proxy_read_timeout      300s;
    proxy_connect_timeout   300s;
    proxy_send_timeout      300s;
    send_timeout            300s;

    # logging
    log_format              main    '$remote_addr - $remote_user [$time_local] "$request" '
                                    '$status $body_bytes_sent "$http_referrer" '
                                    '"$http_user_agent" "$http_x_forwarded_for"';

    # MIME
    include                 mime.types;
    default_type            application/octet-stream;

    # Logging
    access_log              /var/log/nginx/access.log main;
    error_log               /var/log/nginx/error.log warn;

    map $remote_addr $proxy_forwarded_elem {
        # IPv4 addresses can be sent as-is
        ~^[0-9.]+$          "for=$remote_addr";
        # IPv6 addresses need to be bracketed and quoted
        ~^[0-9A-Fa-f:.]+$   "for=\"[$remote_addr]\"";
        # Unix domain socket names cannot be represented in RFC 7239 syntax
        default             "for=unknown";
    }

    map $http_forwarded $proxy_add_forwarded {
        # If the incoming Forwarded header is syntactically valid, append to it
        "~^(,[ \\t]*)*([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21\\x23-\\x5B\\x5D-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?(;([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21\\x23-\\x5B\\x5D-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?)*([ \\t]*,([ \\t]*([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21\\x23-\\x5B\\x5D-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?(;([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21\\x23-\\x5B\\x5D-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?)*)?)*$" "$http_forwarded, $proxy_forwarded_elem";
        # Otherwise, replace it
        default             "$proxy_forwarded_elem";
    }

    include                 /etc/nginx/conf.d/*.conf;
    include                 /etc/nginx/sites-enabled/*;
}
