default_stages: [pre-commit]
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: local
    hooks:
      - id: generate-openapi-spec
        name: Generate OpenAPI spec
        entry: mise run generate:openapi-spec
        language: python
        files: |
          (?x)(
            ^api/src/app/(features|common|authentication|entities)/.*\.py$
            |^api/src/app/app.py$
            |^api/pyproject.toml$
          )
        pass_filenames: false

      - id: generate-api-client-from-spec
        name: Generate the client for our api
        entry: mise run generate:api-client-from-spec
        language: system
        files: ^api/.openapi.json$
        pass_filenames: false

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        name: "Check: conventional formatted commit message"
        stages: [commit-msg]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
        name: "Check: no merge conflict strings"
      - id: no-commit-to-branch
        name: "Check: no commit to main"
        args: [--branch, main, --branch, master]
        stages: [commit-msg]
      - id: check-ast
        name: "Check: parse .py files"
        language_version: python3.14
      - id: check-json
        name: "Check: parse .json files"
      - id: check-toml
        name: "Check: parse .toml files"
      - id: check-yaml
        name: "Check: parse .yaml files"
        # mkdocs.yml uses Python-tagged YAML for mermaid2; docker-compose
        # overrides use Compose-specific !override / !reset tags. Both are
        # valid for their own parsers but not for the standard YAML loader.
        exclude: (^|/)(mkdocs\.yml|docker-compose\.(no-auth|ci)\.yml)$
      - id: check-case-conflict
        name: "Check: no case conflicting file names"
      - id: trailing-whitespace
        name: "Lint : remove trailing whitespaces"
        exclude: ^web/src/api/generated/|^.*\.(lock)$
      - id: end-of-file-fixer
        name: "Lint : files end with only newline"
        exclude: ^web/src/api/generated/|^.*\.(lock)$
      - id: mixed-line-ending
        name: "Lint : consistent file ending"
        exclude: ^.*\.(lock)$
      - id: detect-private-key
        name: "Check: no private keys are commited"
        exclude: api/tests/integration/mock_authentication.py

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.15.14"
    hooks:
      - id: ruff-check
        name: "Lint : ruff (python)"
        files: ^api/.*\.py$
        args: ["--fix"]

      - id: ruff-format
        name: "Lint : ruff-format (python)"
        files: ^api/.*\.py$

  - repo: https://github.com/biomejs/pre-commit
    rev: v2.4.16
    hooks:
      - id: biome-check
        name: "Lint : biome (ts/js)"
        additional_dependencies: ["@biomejs/biome@2.4.15"]
        exclude: |
          (?x)(
            ^web/\.pnp\.cjs$
            |^web/\.pnp\.loader\.mjs$
          )

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        name: "Lint : shfmt (bash)"
        args: ["-w", "-i", "4", "-ci"]
        files: ^(IaC/.*\.sh|\.mise/tasks/iac/[^/]+)$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        name: "Lint : shellcheck (bash)"
        files: ^(IaC/.*\.sh|\.mise/tasks/iac/[^/]+|redis/rootfs/usr/local/sbin/.*\.sh|web/oauth2/.*\.sh|api/src/.*\.sh)$
