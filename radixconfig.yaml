apiVersion: radix.equinor.com/v1
kind: RadixApplication
metadata:
  name: template-fastapi-react
spec:
  build:
    useBuildKit: true
    useBuildCache: true
  environments:
    - name: prod
    - name: staging
      build:
        from: main
    - name: dev
      build:
        from: main
  components:
    - name: api
      image: ghcr.io/equinor/template-fastapi-react/api:{imageTagName}
      alwaysPullImageOnDeploy: true
      resources:
        requests:
          memory: "256Mi"
          cpu: "100m"
        limits:
          memory: "4Gi"
          cpu: "4000m"
      environmentConfig:
        - environment: prod
          imageTagName: latest
          horizontalScaling:
            minReplicas: 1
            maxReplicas: 4
        - environment: staging
          imageTagName: latest
          horizontalScaling:
            minReplicas: 1
            maxReplicas: 2
        - environment: dev
          imageTagName: latest
          horizontalScaling:
            minReplicas: 1
            maxReplicas: 1
      secrets:
        - SECRET_KEY
        - MONGODB_PASSWORD
        - APPINSIGHTS_CONSTRING
      variables:
        LOGGING_LEVEL: "debug"
        AUTH_ENABLED: "True"
        ENVIRONMENT: production
        OAUTH_WELL_KNOWN: https://login.microsoftonline.com/3aa4a235-b6e2-48d5-9195-7fcf05b459b0/v2.0/.well-known/openid-configuration
        OAUTH_AUDIENCE: api://4a761bec-628d-4c4b-860a-4903cbecc963
        MONGODB_USERNAME: root
        MONGODB_DATABASE: test
      ports:
        - name: rest
          port: 5000
      publicPort: rest

    - name: proxy
      image: ghcr.io/equinor/template-fastapi-react/nginx:{imageTagName}
      alwaysPullImageOnDeploy: true
      readOnlyFileSystem: true
      runAsUser: 65532  # nginx
      volumeMounts:
        - name: nginx-cache
          path: /var/cache/nginx
          emptyDir:
            sizeLimit: 10M
        - name: nginx-pid
          path: /run/nginx
          emptyDir:
            sizeLimit: 1M
      environmentConfig:
        - environment: prod
          imageTagName: latest
        - environment: staging
          imageTagName: latest
        - environment: dev
          imageTagName: latest
      ports:
        - name: nginx
          port: 8080
      publicPort: nginx

    - name: db
      image: mongo:7.0.30
      alwaysPullImageOnDeploy: true
      command:
        - --auth
        - --quiet
      variables:
        MONGODB_USERNAME: root
        MONGODB_DATABASE: test
      secrets:
        - MONGODB_PASSWORD
        - MONGODB_ROOT_PASSWORD
      ports:
        - name: dbport
          port: 27017
      publicPort: dbport

    - name: oauth2
      image: ghcr.io/equinor/template-fastapi-react/oauth2:{imageTagName}
      runAsUser: 65532  # nonroot
      environmentConfig:
        - environment: prod
          imageTagName: latest
          variables:
            OAUTH2_PROXY_REDIRECT_URL: https://template-fastapi-react.equinor.com/oauth2/callback
            # Replace with the SPA-facing client id of your Azure AD app registration.
            OAUTH_CLIENT_ID: 00000000-0000-0000-0000-000000000000
            OAUTH_AUTH_SCOPE: api://4a761bec-628d-4c4b-860a-4903cbecc963/api
        - environment: staging
          imageTagName: latest
          variables:
            OAUTH2_PROXY_REDIRECT_URL: https://proxy-template-fastapi-react-staging.radix.equinor.com/oauth2/callback
            OAUTH_CLIENT_ID: 00000000-0000-0000-0000-000000000000
            OAUTH_AUTH_SCOPE: api://4a761bec-628d-4c4b-860a-4903cbecc963/api
        - environment: dev
          imageTagName: latest
          variables:
            OAUTH2_PROXY_REDIRECT_URL: https://proxy-template-fastapi-react-dev.radix.equinor.com/oauth2/callback
            OAUTH_CLIENT_ID: 00000000-0000-0000-0000-000000000000
            OAUTH_AUTH_SCOPE: api://4a761bec-628d-4c4b-860a-4903cbecc963/api
      variables:
        AZURE_TENANT_ID: 3aa4a235-b6e2-48d5-9195-7fcf05b459b0
      secrets:
        - CLIENT_SECRET
        - OAUTH2_PROXY_REDIS_PASSWORD
        - OAUTH2_PROXY_COOKIE_SECRET
      ports:
        - name: oauth2
          port: 8081

    - name: cookie-cache
      image: ghcr.io/equinor/template-fastapi-react/redis:{imageTagName}
      runAsUser: 65532  # nonroot
      environmentConfig:
        - environment: prod
          imageTagName: latest
        - environment: staging
          imageTagName: latest
        - environment: dev
          imageTagName: latest
      ports:
        - name: cookie-cache
          port: 6379
      secrets:
        - REDIS_PASSWORD

  dnsAppAlias:
    environment: prod
    component: proxy
