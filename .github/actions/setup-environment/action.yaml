name: Set up environment
description: Configure development environment with all runtimes and dependencies

runs:
  using: composite
  steps:
    - name: "Setup: sparse checkout runtimes"
      if: hashFiles('web/package.json') == ''
      shell: bash
      # Node's postinstall needs web/; API/docs-only jobs must also work without a warm cache.
      run: echo "MISE_DISABLE_TOOLS=node" >> "$GITHUB_ENV"

    - name: "Cache: API dependencies"
      id: cache-api
      if: hashFiles('api') != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: api/.venv
        key: deps-api-${{ runner.os }}-${{ hashFiles('.mise/config.toml', 'api/pyproject.toml', 'api/uv.lock') }}

    - name: "Cache: web dependencies"
      id: cache-web
      if: hashFiles('web/package.json') != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: web/.pnpm-store
        key: deps-web-${{ runner.os }}-${{ hashFiles('.mise/config.toml', 'web/pnpm-lock.yaml', 'web/pnpm-workspace.yaml') }}

    - name: "Cache: docs dependencies"
      id: cache-docs
      if: hashFiles('docs') != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: docs/.venv
        key: deps-docs-${{ runner.os }}-${{ hashFiles('.mise/config.toml', 'docs/pyproject.toml', 'docs/uv.lock') }}

    - name: "Setup: Runtimes"
      uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

    - name: "Setup: install API dependencies"
      if: hashFiles('api') != ''
      shell: bash
      run: mise run install-dependencies:api

    - name: "Setup: web dependencies"
      if: hashFiles('web/package.json') != ''
      shell: bash
      run: mise run install-dependencies:web

    - name: "Setup: install docs dependencies"
      if: hashFiles('docs') != ''
      working-directory: ./docs
      shell: bash
      run: uv sync --locked
