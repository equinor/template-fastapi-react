name: "Test"
on:
  # Workflow dispatch is used for manual triggers
  workflow_dispatch:
  # Workflow call is used for called from another workflow
  workflow_call:

permissions:
  contents: read
  packages: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: "Setup: checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            .mise
            api

      - name: "Setup: Environment"
        uses: ./.github/actions/setup-environment
        timeout-minutes: 5

      - name: "Run: pytest unit tests"
        run: mise run test:api:unit

  api-integration-tests:
    runs-on: ubuntu-latest
    env:
      API_IMAGE: ghcr.io/equinor/template-fastapi-react/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to image registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image
        run: |
          docker pull "$API_IMAGE"
          docker build --target development --tag api-development ./api # TODO: --cache-from $API_IMAGE
      - name: BDD Integration tests
        if: false # disable for now
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml run api behave

      - name: Pytest Integration tests
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm api pytest --integration

  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            .mise
            web

      - name: "Setup: Environment"
        uses: ./.github/actions/setup-environment
        timeout-minutes: 5

      - name: "Run: web checks"
        run: mise run lint:web

      - name: "Run: web tests"
        run: mise run test:web

      - name: "Run: production web build"
        run: mise run build:web

  docs-tests:
    name: test-docs
    runs-on: ubuntu-latest

    steps:
      - name: "Setup: checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            .mise
            docs

      - name: "Setup: Environment"
        uses: ./.github/actions/setup-environment
        timeout-minutes: 5

      - name: "Run: build docs site"
        run: mise run docs:build
