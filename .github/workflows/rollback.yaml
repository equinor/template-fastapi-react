name: "Rollback prod to an older release"
on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: "GitHub release tag. Must match a Docker image tag"
        required: true
        type: string

permissions: {}

concurrency:
  group: rollback-production
  cancel-in-progress: false

jobs:
  set-prod-tag:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        image:
          [
            ghcr.io/equinor/template-fastapi-react/api,
            ghcr.io/equinor/template-fastapi-react/web,
            ghcr.io/equinor/template-fastapi-react/nginx,
          ]
    steps:
      - name: "Login to image registry"
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Set prod tag on older image"
        env:
          IMAGE: ${{ matrix.image }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          echo "Tagging $IMAGE:$RELEASE_TAG with 'production'"
          docker pull "$IMAGE:$RELEASE_TAG"
          docker tag "$IMAGE:$RELEASE_TAG" "$IMAGE:production"
          docker push "$IMAGE:production"

  # uncomment to apply rollback to radix
