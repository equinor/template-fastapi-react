name: "On PR updated"
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  linting-and-checks:
    name: "Linting and checks"
    uses: ./.github/workflows/linting-and-checks.yaml

  tests:
    name: "Tests"
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/tests.yaml
