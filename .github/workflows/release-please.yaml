name: release-please

on:
  workflow_call:
    secrets:
      APP_PRIVATE_KEY:
        description: "Private key for the release GitHub App"
        required: true
    outputs:
      release_created:
        description: "If 'true', a release PR was merged and GitHub release was created"
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: "The released tag. Ex 'v1.2.3'"
        value: ${{ jobs.release-please.outputs.tag_name }}

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Create token
        id: create-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: release-please
        id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
          token: ${{ steps.create-token.outputs.token }}
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
