name: GitHub Actions security analysis

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Audit workflows with zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # Required for SARIF uploads in private repositories.
      security-events: write # Upload findings to code scanning.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          inputs: .github/workflows
          version: "1.29.0"
