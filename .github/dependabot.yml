version: 2

registries:
  dhi-io:
    type: docker-registry
    url: https://dhi.io
    username: ${{secrets.DHI_USERNAME}}
    password: ${{secrets.DHI_PASSWORD}}

updates:
  - package-ecosystem: 'github-actions'
    directories:
      - '/.github/workflows'
      - '/.github/actions/*'
    groups:
      ci:
        patterns: ['*']
      ci-security:
        applies-to: security-updates
        patterns: ['*']
    schedule: # schedules do not apply to security updates
      interval: 'cron' # active projects are recommended to update dependencies "monthly" instead
      cronjob: '0 0 1 3,10 *' # At 00:00 on day-of-month 1 in March and October
    cooldown:
      default-days: 7

  - package-ecosystem: 'pre-commit'
    directory: '/'
    groups:
      pre-commit:
        patterns: ['*']
    schedule:
      interval: 'cron'
      cronjob: '0 0 1 3,10 *'
    cooldown:
      default-days: 7

  - package-ecosystem: 'docker'
    directories:
      - '/api'
      - '/web'
    registries:
      - dhi-io
    groups:
      docker:
        update-types: [minor, patch]
    schedule:
      interval: 'cron'
      cronjob: '0 0 1 3,10 *'
    cooldown:
      default-days: 7

  - package-ecosystem: 'uv'
    directory: '/api'
    groups:
      api-prod:
        dependency-type: production
        update-types: [minor, patch]
      api-dev:
        dependency-type: development
      api-security:
        applies-to: security-updates
        patterns: ['*']
    schedule:
      interval: 'cron'
      cronjob: '0 0 1 3,10 *'
    cooldown:
      default-days: 7

  - package-ecosystem: 'uv'
    directory: '/docs'
    groups:
      docs:
        patterns: ['*']
      docs-security:
        applies-to: security-updates
        patterns: ['*']
    schedule:
      interval: 'cron'
      cronjob: '0 0 1 3,10 *'
    cooldown:
      default-days: 7

  - package-ecosystem: 'npm'
    directory: '/web'
    groups:
      vite-plus:
        patterns:
          - 'vite'
          - 'vite-plus'
          - '@voidzero-dev/vite-plus-core'
      web-prod:
        dependency-type: production
        update-types: [minor, patch]
      web-dev:
        dependency-type: development
      web-security:
        applies-to: security-updates
        patterns: ['*']
    schedule:
      interval: 'cron'
      cronjob: '0 0 1 3,10 *'
    cooldown:
      default-days: 7

  - package-ecosystem: 'npm'
    directory: '/openapi'
    ignore:
      # The generator still requires the TypeScript 6 JavaScript compiler API.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      openapi-generator:
        patterns: ['*']
      openapi-security:
        applies-to: security-updates
        patterns: ['*']
    schedule:
      interval: 'cron'
      cronjob: '0 0 1 3,10 *'
    cooldown:
      default-days: 7
