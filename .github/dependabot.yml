version: 2

registries:
  dhi-io:
    type: docker-registry
    url: https://dhi.io
    username: ${{secrets.DHI_USERNAME}}
    password: ${{secrets.DHI_PASSWORD}}

updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/.github/workflows"
      - "/.github/actions/*"
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
    schedule: # schedules do not apply to security updates
      interval: "cron" # active projects are recommended to update dependencies "monthly" instead
      cron: "0 0 1 3,10 *" # At 00:00 on day-of-month 1 in March and October
    cooldown:
      default-days: 7

  - package-ecosystem: "pre-commit"
    directory: "/"
    groups:
      pre-commit:
        update-types:
          - "minor"
          - "patch"
    schedule:
      interval: "cron"
      cron: "0 0 1 3,10 *"
    cooldown:
      default-days: 7

  - package-ecosystem: "docker"
    directories:
      - "/api"
      - "/web"
    registries:
      - dhi-io
    groups:
      dockerfile:
        update-types:
          - "minor"
          - "patch"
    schedule:
      interval: "cron"
      cron: "0 0 1 3,10 *"
    cooldown:
      default-days: 7

  - package-ecosystem: "uv"
    directory: "/api"
    groups:
      api:
        update-types:
          - "minor"
          - "patch"
      api-security:
        applies-to: security-updates
        patterns: ["*"]
    schedule:
      interval: "cron"
      cron: "0 0 1 3,10 *"
    cooldown:
      default-days: 7

  - package-ecosystem: "uv"
    directory: "/docs"
    groups:
      docs:
        update-types:
          - "minor"
          - "patch"
      docs-security:
        applies-to: security-updates
        patterns: ["*"]
    schedule:
      interval: "cron"
      cron: "0 0 1 3,10 *"
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    directory: "/web"
    groups:
      web:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "@hey-api/openapi-ts"
      web-security:
        applies-to: security-updates
        patterns: ["*"]
    schedule:
      interval: "cron"
      cron: "0 0 1 3,10 *"
    cooldown:
      default-days: 7
