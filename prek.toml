# Configuration for prek, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

default_stages = ["pre-commit"]
default_install_hook_types = ["pre-commit", "commit-msg"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-shebang-scripts-are-executable" },
  { id = "check-executables-have-shebangs" },
]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-merge-conflict", name = "Check: no merge conflict strings" },
  { id = "no-commit-to-branch", name = "Check: no commit to main", args = ["--branch", "main", "--branch", "master"], stages = ["commit-msg"] },
  { id = "check-ast", name = "Check: parse .py files", language_version = "python3.14" },
  { id = "check-json", name = "Check: parse .json files" },
  { id = "check-toml", name = "Check: parse .toml files" },
  { id = "check-yaml", name = "Check: parse .yaml files", exclude = "(^|/)(mkdocs\\.yml|docker-compose\\.(no-auth|ci)\\.yml)$" },
  { id = "check-case-conflict", name = "Check: no case conflicting file names" },
  { id = "trailing-whitespace", name = "Lint : remove trailing whitespaces", exclude = "^web/src/api/generated/|^.*\\.(lock)$" },
  { id = "end-of-file-fixer", name = "Lint : files end with only newline", exclude = "^web/src/api/generated/|^.*\\.(lock)$" },
  { id = "mixed-line-ending", name = "Lint : consistent file ending", exclude = "^.*\\.(lock)$" },
  { id = "detect-private-key", name = "Check: no private keys are commited", exclude = "api/tests/integration/mock_authentication.py" },
]

[[repos]]
repo = "local"
hooks = [
  { id = "generate-openapi-spec", name = "Generate OpenAPI spec", entry = "mise run generate:openapi-spec", language = "python", files = "(?x)(^api/src/app/(features|common|authentication|entities)/.*\\.py$|^api/src/app/app\\.py$|^api/pyproject\\.toml$)", pass_filenames = false },
  { id = "generate-api-client-from-spec", name = "Generate the client for our api", entry = "mise run generate:api-client-from-spec", language = "system", files = "^api/\\.openapi\\.json$", pass_filenames = false },
  { id = "vite-plus-check", name = "Lint : Vite+ (web)", entry = "mise exec -- bash -c 'cd web && files=(); for file; do files+=(\"${file#web/}\"); done; pnpm exec vp check --fix \"${files[@]}\"' --", language = "system", files = "^web/.*\\.(ts|tsx|js|jsx|mts|mjs|cts|cjs|json|jsonc|css|html|md|yaml|yml)$", exclude = "^web/(src/api-generated/|src/app/routeTree\\.gen\\.ts$|pnpm-lock\\.yaml$)" },
  { id = "ensure-consistent-tool-versions", name = "Check Docker and mise tool versions", entry = "mise run github-actions:ensure-consistent-tool-versions", language = "system", files = "^(\\.mise/config\\.toml|.*Dockerfile[^/]*)$", pass_filenames = false },
  { id = "ensure-consistent-vite-plus-versions", name = "Check Vite+ versions", entry = "mise run github-actions:ensure-consistent-vite-plus-versions", language = "system", files = "^(\\.mise/config\\.toml|web/package\\.json|web/pnpm-workspace\\.yaml)$", pass_filenames = false },
  { id = "dependabot-is-aware-of-all-lockfiles", name = "Check Dependabot coverage for lockfiles and Dockerfiles", entry = "mise run github-actions:dependabot-is-aware-of-all-lockfiles", language = "system", files = "^(\\.github/dependabot\\.yml|.*Dockerfile[^/]*|.*(uv\\.lock|\\.py\\.lock|pnpm-lock\\.yaml|package-lock\\.json|yarn\\.lock))$", pass_filenames = false },
  # hadolint is installed by mise; keep its version in .mise/config.toml.
  { id = "hadolint", name = "Lint Dockerfiles", entry = "hadolint", language = "system", files = "(^|/)Dockerfile([^/]*)?$" },
  { id = "dclint", name = "Lint Docker Compose files", entry = "dclint", language = "node", language_version = "system", additional_dependencies = ["dclint@3.1.0"], files = "(^|/)(docker-)?compose([.-][a-zA-Z0-9_-]+)?\\.ya?ml$" },
]

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"
hooks = [
  { id = "conventional-pre-commit", name = "Check: conventional formatted commit message", stages = ["commit-msg"] },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.2"
hooks = [
  { id = "ruff-check", name = "Lint : ruff (python)", files = "^api/.*\\.py$", args = ["--fix"] },
  { id = "ruff-format", name = "Lint : ruff-format (python)", files = "^api/.*\\.py$" },
]

[[repos]]
repo = "https://github.com/scop/pre-commit-shfmt"
rev = "v3.13.1-1"
hooks = [
  { id = "shfmt", name = "Lint : shfmt (bash)", args = ["-w", "-i", "4", "-ci"], files = "^(IaC/.*\\.sh|\\.mise/tasks/iac/[^/]+)$" },
]

[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1"
hooks = [
  { id = "shellcheck", name = "Lint : shellcheck (bash)", files = "^(IaC/.*\\.sh|\\.mise/tasks/iac/[^/]+|redis/rootfs/usr/local/sbin/.*\\.sh|web/oauth2/.*\\.sh|api/src/.*\\.sh)$" },
]
