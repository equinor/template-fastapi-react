services:
  api:
    build:
      target: development
    image: template-api-dev
    volumes:
      - ./api/src/:/app/src
    env_file:
      - .env
    environment:
      ENVIRONMENT: local
      LOGGING_LEVEL: debug
      MONGODB_DATABASE: $MONGODB_DATABASE
      MONGODB_USERNAME: $MONGODB_USERNAME
      MONGODB_PASSWORD: $MONGODB_PASSWORD
      AUTH_ENABLED: $AUTH_ENABLED
      MONGODB_HOSTNAME: db
      MONGODB_PORT: $MONGODB_PORT
      OAUTH_WELL_KNOWN: $OAUTH_WELL_KNOWN
      OAUTH_AUDIENCE: $OAUTH_AUDIENCE
      SECRET_KEY: $SECRET_KEY
      APPINSIGHTS_CONSTRING: $APPINSIGHTS_CONSTRING
      # Service principal used to authenticate Azure Monitor ingestion
      # (mirrors CoreDM). Optional — when unset the SDK falls back to
      # instrumentation-key auth from APPINSIGHTS_CONSTRING.
      AZURE_TENANT_ID: $AZURE_TENANT_ID
      OAUTH_CLIENT_ID: $OAUTH_CLIENT_ID
      OAUTH_CLIENT_SECRET: $OAUTH_CLIENT_SECRET
    depends_on:
      - db
    links:
      - db

  nginx:
    build:
      target: nginx-dev

  web:
    restart: unless-stopped
    build:
      target: development
      context: ./web
    image: template-web-dev
    stdin_open: true
    volumes:
      - ./web/src:/code/src
    env_file:
      - .env
    environment:
      - NODE_ENV=development

  db:
    volumes:
      - database:/data/db
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: $MONGODB_USERNAME
      MONGO_INITDB_ROOT_PASSWORD: $MONGODB_PASSWORD

  oauth2:
    environment:
      OAUTH2_PROXY_SHOW_DEBUG_ON_ERROR: "true"
    volumes:
      - ./web/oauth2/entrypoint.sh:/usr/local/bin/entrypoint.sh
      - ./web/oauth2/oauth2-proxy.toml:/etc/oauth2-proxy.toml
      - ./web/oauth2/oauth2-proxy.yaml:/etc/oauth2-proxy.yaml

volumes:
  database:

