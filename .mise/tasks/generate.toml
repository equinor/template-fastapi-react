["generate:openapi-spec"]
description = "Generate the OpenAPI JSON Schema for the API"
depends = ["install-dependencies:api"]
dir = "{{config_root}}/api"
run = "uv run python -m app open-api"

["generate:api-client-from-spec"]
description = "Generate typescript types from the OpenAPI JSON Schema"
depends = ["generate:openapi-spec", "install-dependencies:openapi"]
dir = "{{config_root}}/openapi"
run = "vpr generate"

["generate:api-client"]
description = "Generate the API client from the existing OpenAPI JSON Schema"
depends = ["install-dependencies:openapi"]
dir = "{{config_root}}/openapi"
run = "vpr generate"
