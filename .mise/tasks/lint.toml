["lint:api:typecheck"]
description = "Typecheck the API, with mypy"
dir = "{{config_root}}/api"
run = "uv run mypy src"

["lint:api"]
description = "Lint the API"
run = [
    "mise run lint:api:typecheck",
]

["lint:web:typecheck"]
description = "Typecheck the Web application, by compiling the TypeScript code"
depends = ["install-dependencies:web"]
dir = "{{config_root}}/web"
run = "pnpm compile"

["lint:web:check"]
description = "Check web formatting, lint rules and types with Vite+"
depends = ["install-dependencies:web"]
dir = "{{config_root}}/web"
run = "pnpm exec vp check"

["lint:web"]
description = "Lint the Web application"
run = [
    "mise run lint:web:typecheck",
    "mise run lint:web:check",
]

["lint:shell"]
description = "Lint shell scripts with shellcheck"
dir = "{{config_root}}"
run = "shellcheck --external-sources IaC/*.sh .mise/tasks/iac/* redis/rootfs/usr/local/sbin/*.sh web/oauth2/*.sh api/src/*.sh"

["lint:workflows"]
description = "Audit GitHub Actions workflows with zizmor"
dir = "{{config_root}}"
run = "zizmor --offline .github/workflows"

[lint]
description = "Lint the entire project"
depends = ["lint:shell", "lint:api", "lint:web", "lint:workflows"]
run = "mise fmt"
