# dclint disable no-build-and-image service-image-require-explicit-tag service-keys-order services-alphabetical-order
# The CI image name is consumed by the integration-test job; keep its established service layout.
name: template-fastapi-react

services:
  api:
    build:
      target: development
    image: development
    # CI has no `.env` file; the base compose's defaults cover MONGODB_*,
    # ENVIRONMENT defaults to "local" in api/src/app/config.py, and
    # AUTH_ENABLED defaults to False — but pin it here as defense-in-depth
    # in case that default ever flips.
    env_file: !reset []
    environment:
      AUTH_ENABLED: "False"
    depends_on:
      - db
    links:
      - db

  db: {}
