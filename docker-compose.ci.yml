services:
  api:
    build:
      target: development
    image: development
    # CI has no `.env` file; the base compose's defaults cover MONGODB_*,
    # ENVIRONMENT defaults to "local" in api/src/app/config.py, and
    # AUTH_ENABLED defaults to False — but pin it here as defense-in-depth
    # in case that default ever flips.
    env_file: !reset []
    environment:
      AUTH_ENABLED: "False"
    depends_on:
      - db
    links:
      - db

  db: {}
